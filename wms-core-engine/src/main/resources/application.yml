spring:
  application:
    name: wms-core-engine

  main:
    # 1. Desliga o banner ASCII do Spring Boot no console/logs
    banner-mode: "off"

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Deixa o Flyway gerenciar a estrutura do banco
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080
  error:
    # 2. Desativa a página padrão de erro (Whitelabel) do Spring Boot que o Wappalyzer caça
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        # 3. Renomeia o cookie de sessão: de JSESSIONID (padrão Java/Tomcat) para um nome neutro
        name: APP_SESSION_ID