spring:
  application:
    name: wms-core-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/wms_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Deixa o Flyway gerenciar a estrutura do banco
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true
    validate-on-migrate: false

server:
  port: 8080